name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 9 * * 1'

jobs:
  ci:
    uses: LegionIO/.github/.github/workflows/ci.yml@main
    with:
      companion-gems: >-
        ${{ github.event_name == 'pull_request' && '{"lex-llm":{"repository":"LegionIO/lex-llm","ref":"d1f3e97d18af3f21cc8e15de76c76a6fd53b18da"},"lex-llm-vllm":{"repository":"LegionIO/lex-llm-vllm","ref":"7c74befe51681372cd292e7b643ceee0eb95bfb7"},"lex-llm-bedrock":{"repository":"LegionIO/lex-llm-bedrock","ref":"2a13952abf18ca9b1a0c2d75fe47b53bc625580f"}}' || '{}' }}

  lint:
    uses: LegionIO/.github/.github/workflows/lint-patterns.yml@main

  security:
    uses: LegionIO/.github/.github/workflows/security-scan.yml@main
    with:
      companion-gems: >-
        ${{ github.event_name == 'pull_request' && '{"lex-llm":{"repository":"LegionIO/lex-llm","ref":"d1f3e97d18af3f21cc8e15de76c76a6fd53b18da"},"lex-llm-vllm":{"repository":"LegionIO/lex-llm-vllm","ref":"7c74befe51681372cd292e7b643ceee0eb95bfb7"},"lex-llm-bedrock":{"repository":"LegionIO/lex-llm-bedrock","ref":"2a13952abf18ca9b1a0c2d75fe47b53bc625580f"}}' || '{}' }}

  version-changelog:
    uses: LegionIO/.github/.github/workflows/version-changelog.yml@main

  dependency-review:
    uses: LegionIO/.github/.github/workflows/dependency-review.yml@main

  stale:
    if: github.event_name == 'schedule'
    uses: LegionIO/.github/.github/workflows/stale.yml@main

  release:
    needs: [ci, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: LegionIO/.github/.github/workflows/release.yml@main
    secrets:
      rubygems-api-key: ${{ secrets.RUBYGEMS_API_KEY }}
